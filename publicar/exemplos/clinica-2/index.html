  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F6F1EA; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #F6F1EA; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#F6F1EA"></rect><line x1="470" y1="300" x2="730" y2="300" stroke="#B08D57" stroke-width="6"></line><text x="600" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="220" fill="#141210">CE</text></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

a .numero{font-variant-numeric:lining-nums tabular-nums;font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--cinza-quente);}\n.area h3{font-size:clamp(28px, 2.4vw, 34px);line-height:1.12;}\n.area p{font-size:16px;color:var(--cinza-quente);}\n.saiba-mais{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:44px;margin-top:0;padding:0;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--bege-linha);transition:border-color .25s var(--suave);}\n.saiba-mais span{transition:transform .25s var(--suave);}\n.saiba-mais:hover{border-color:var(--preto);}\n.saiba-mais:hover span{transform:translateX(4px);}\n\n/* Como funciona */\n.passos{--gap:clamp(40px, 4vw, 64px);display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:var(--gap);margin-top:clamp(56px, 6vw, 96px);}\n.passo{position:relative;display:flex;flex-direction:column;gap:18px;}\n.passo:not(:last-child)::after{content:\"\";position:absolute;top:32px;left:88px;right:calc(-1 * var(--gap) + 24px);height:1px;background:var(--dourado);transform-origin:left center;}\n.passo .marcador{transition:background-color .5s var(--suave), color .5s var(--suave), border-color .5s var(--suave);}\n.passo>*:not(.marcador){transition:opacity .7s var(--suave), transform .7s var(--suave);}\n.anima .passo:not(:last-child)::after{transform:scaleX(0);transition:transform 1s var(--suave);transition-delay:calc(var(--i) * .9s + .35s);}\n.anima .passo>*:not(.marcador){opacity:0;transform:translateY(14px);transition-delay:calc(var(--i) * .9s + .15s);}\n.anima .passo .marcador{opacity:.35;transition:opacity .5s var(--suave), background-color .5s var(--suave), color .5s var(--suave);transition-delay:calc(var(--i) * .9s);}\n.anima.visivel .passo:not(:last-child)::after{transform:none;}\n.anima.visivel .passo>*:not(.marcador){opacity:1;transform:none;}\n.anima.visivel .passo .marcador{opacity:1;background:var(--dourado);color:var(--preto);}\n.marcador{width:64px;height:64px;border:1px solid var(--dourado);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:lining-nums;color:var(--bege);margin-bottom:12px;}\n.passo h3{font-size:clamp(30px, 2.6vw, 36px);line-height:1.1;}\n.passo p{color:var(--cinza-claro);max-width:340px;}\n.passo .passo-linha{color:var(--bege);font-weight:500;}\n.passo-lista{list-style:none;margin:6px 0 0;padding:16px 0 0;border-top:1px solid rgba(207,198,186,.22);display:flex;flex-direction:column;gap:10px;max-width:340px;}\n.passo-lista li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;align-items:baseline;font-size:15px;color:var(--cinza-claro);}\n.passo-lista li::before{content:\"\";width:14px;height:1px;background:var(--dourado-claro);transform:translateY(-4px);}\n\n/* Equipe */\n.duas-colunas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px, 7vw, 112px);}\n.equipe{align-items:center;padding-bottom:clamp(56px, 6vw, 88px);}\n.equipe .foto{max-width:520px;}\n.revela-moldura{display:block;overflow:hidden;}\n.revela-moldura img{display:block;}\n.equipe .titulo-secao{font-size:clamp(36px, 3.4vw, 50px);}\n.coluna{display:flex;flex-direction:column;gap:24px;min-width:0;max-width:540px;}\n.compromissos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:0 28px;border-top:1px solid var(--bege-linha);}\n.compromissos li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--bege-linha);font-size:15px;}\n.compromissos li::before{content:\"\";width:6px;height:6px;background:var(--dourado);transform:rotate(45deg) translateY(-2px);}\n.citacao{margin:8px 0 0;padding-left:24px;border-left:1px solid var(--dourado);}\n.citacao p{font-family:var(--serif);font-size:clamp(24px, 2.2vw, 30px);font-weight:500;line-height:1.25;color:var(--preto);} ont-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--cinza-quente);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--dourado);}\n.painel-rua{font-family:var(--serif);font-size:clamp(26px, 2.4vw, 34px);font-weight:500;line-height:1.15;}\n.painel-bairro{margin-top:8px;font-size:16px;color:var(--cinza-quente);}\n.horarios{margin:0;display:flex;flex-direction:column;}\n.horarios div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--bege-linha);font-size:16px;}\n.horarios dt{font-weight:500;}\n.horarios dd{margin:0;color:var(--cinza-quente);font-variant-numeric:lining-nums tabular-nums;}\n.como-chegar{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}\n.como-chegar li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:baseline;font-size:16px;color:var(--cinza-quente);}\n.como-chegar li::before{content:\"\";width:6px;height:6px;background:var(--dourado);transform:rotate(45deg) translateY(-2px);}\n.unidades-aviso{margin-top:28px;font-size:14px;color:var(--cinza-quente);}\n.revela-contato.pronto .abas,.revela-contato.pronto .paineis{opacity:0;transform:translateY(20px);transition:opacity .8s var(--suave), transform .9s var(--suave);}\n.revela-contato.pronto .paineis{transition-delay:.15s;}\n.revela-contato.pronto.visivel .abas,.revela-contato.pronto.visivel .paineis{opacity:1;transform:none;}\n.contato-botoes{margin-top:clamp(40px, 5vw, 64px);}\n\n/* Faixa final */\n.faixa .conteudo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:40px 64px;}\n.faixa .cabeca-secao{max-width:980px;}\n.faixa h2{font-size:clamp(40px, 4.8vw, 70px);line-height:1.02;letter-spacing:-.01em;}\n.titulo-palavras .p{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em;}\n.titulo-palavras .p>span{display:inline-block;}\n.palavras-pronto .titulo-palavras .p>span{transform:translateY(105%);transition:transform .9s var(--suave);transition-delay:calc(var(--n) * 70ms);}\n.palavras-pronto.visivel .titulo-palavras .p>span{transform:none;}\n.agenda-passos{list-style:none;margin:clamp(24px, 3vw, 40px) 0 0;padding:0;width:100%;display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:clamp(24px, 3vw, 48px);counter-reset:none;}\n.agenda-passos li{position:relative;display:flex;flex-direction:column;gap:8px;padding-top:24px;border-top:1px solid var(--linha-escura);}\n.agenda-passos li:not(:last-child)::after{content:\"→\";position:absolute;top:18px;right:0;color:var(--dourado-claro);font-size:18px;line-height:1;}\n.agenda-num{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--dourado-claro);font-variant-numeric:lining-nums tabular-nums;}\n.agenda-titulo{font-family:var(--serif);font-size:clamp(26px, 2.2vw, 32px);font-weight:500;line-height:1.1;color:var(--bege);}\n.agenda-texto{font-size:15px;color:var(--cinza-claro);max-width:300px;}\n\n/* Rodapé */\n.rodape .conteudo{padding-bottom:40px;}\n.rodape-colunas{position:relative;padding-top:clamp(56px, 6vw, 88px);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:48px clamp(32px, 4vw, 64px);}\n.rodape-colunas::before{content:\"\";position:absolute;top:0;left:0;right:0;height:1px;background:var(--dourado);transform-origin:left center;}\n.revela-rodape.pronto::before{transform:scaleX(0);transition:transform 1.4s var(--suave);}\n.revela-rodape.pronto>*{opacity:0;transform:translateY(16px);transition:opacity .7s var(--suave), transform .8s var(--suave);}\n.revela-rodape.pronto>*:nth-child(1){transition-delay:.5s;}\n.revela-rodape.pronto>*:nth-child(2){transition-delay:.62s;}\n.revela-rodape.pronto>*:nth-child(3){transition-delay:.74s;}\n.revela-rodape.pronto.visivel::before{transform:none;}\n.revela-rodape.pronto.visivel>*{opacity:1;transform:none;}\n.rodape-links{margin-top:20px;}\n.rodape .marca{display:block;font-size:28px;margin-bottom:16px;}\n.rodape-coluna h2{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--dourado-claro);margin-bottom:20px;}\n.rodape-coluna li+li{margin-top:2px;}\n.rodape-coluna a{display:inline-block;font-size:15px;padding:10px 0 8px;background-position:0 calc(100% - 6px);background:linear-gradient(var(--bege), var(--bege)) no-repeat 0 100% / 0 1px;transition:background-size .3s var(--suave);}\n.rodape-coluna a:hover{background-size:100% 1px;color:var(--bege);}\n.rodape p,.rodape dd{font-size:15px;color:var(--cinza-claro);}\n.rodape dl{margin:0;display:flex;flex-direction:column;gap:14px;}\n.rodape dt{font-size:15px;font-weight:600;}\n.rodape dd{margin:2px 0 0;}\n.rodape dd+dd{font-size:14px;}\n.rodape-base{margin-top:clamp(48px, 6vw, 80px);padding-top:24px;border-top:1px solid var(--linha-escura);font-size:14px;color:var(--cinza-claro);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px;}\n.topo{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600;color:var(--bege);}\n.topo span{transition:transform .25s var(--suave);}\n.topo:hover span{transform:translateY(-3px);}\n\n/* Telas médias */\n@media (max-width: 1023px){\n  .menu,.botao-cabecalho{display:none;}\n  .botao-menu{display:inline-flex;align-items:center;}\n  .cabecalho.aberto .menu-celular{display:flex;flex-direction:column;padding:4px var(--lateral) 24px;}\n  .menu-celular a{padding:14px 0;border-bottom:1px solid var(--bege-linha);font-size:18px;}\n  .menu-celular .botao{margin-top:20px;border-bottom:0;font-size:15px;}\n  .grade-areas{grid-template-columns:minmax(0,1fr);}\n  .painel{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}\n  .painel-endereco{grid-column:1 / -1;}\n  .rodape-colunas{grid-template-columns:repeat(2, minmax(0,1fr));}\n  .rodape-marca{grid-column:1 / -1;}\n}\n@media (max-width: 899px){\n  .passos{grid-template-columns:minmax(0,1fr);}\n  .passo{display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:28px;row-gap:10px;}\n  .passo .marcador{grid-row:1 / span 2;margin-bottom:0;}\n  .passo h3{padding-top:14px;}\n  .passo>*:not(.marcador):not(h3){grid-column:2;}\n  .anima .passo:not(:last-child)::after{transform:scaleY(0);transform-origin:center top;}\n  .passo:not(:last-child)::after{top:80px;left:32px;right:auto;bottom:calc(-1 * var(--gap) + 16px);width:1px;height:auto;}\n}\n/* Celular */\n@media (max-width: 699px){\n  .apresentacao{grid-template-columns:minmax(0,1fr);}\n  .apresentacao-topo,.apresentacao-texto,.foto-apresentacao{grid-column:1 / -1;}\n  .areas-layout,.duas-colunas{grid-template-columns:minmax(0,1fr);}\n  .painel{grid-template-columns:minmax(0,1fr);}\n  .areas-layout .foto,.duvidas .cabeca-secao{position:static;}\n  .apresentacao-topo{order:1;}\n  .foto-apresentacao{order:2;}\n  .apresentacao-texto{order:3;}\n  .foto-apresentacao img{aspect-ratio:4 / 3;object-fit:cover;object-position:center 60%;}\n  .areas-layout .foto{order:2;}\n  .areas-layout .foto img{aspect-ratio:16 / 10;object-fit:cover;object-position:center 40%;}\n  .foto-duvidas{display:none;}\n  .duvida-resposta p{padding-right:0;}\n  .linha{display:inline;}\n  .rodape-colunas{grid-template-columns:minmax(0,1fr);}\n  .agenda-passos{grid-template-columns:minmax(0,1fr);}\n  .agenda-passos li::after{display:none;}\n  .time,.compromissos{grid-template-columns:minmax(0,1fr);}\n}\n@media (max-width: 480px){\n  .marca{font-size:23px;}\n  .botoes{flex-direction:column;}\n  .botao{width:100%;}\n}\n@media (prefers-reduced-motion: reduce){\n  .anima .passo:not(:last-child)::after,.anima .passo>*,.anima .passo .marcador{transition:none !important;transition-delay:0s !important;}\n  html{scroll-behavior:auto;}\n  *,*::before,*::after{animation:none !important;transition:none !important;}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<header class=\"cabecalho\" id=\"cabecalho\">\n  <div class=\"conteudo\">\n    <a class=\"marca\" href=\"#inicio\">Clínica Estética<\u002Fa>\n    <nav 1jnZWbjLy6un8b02dqOSLg33N1LHkV4pp/UAOs8vN1MZjwiUJR7CtoADnK//9k=\" width=\"800\" height=\"1000\" alt=\"Sala de espera clara com poltronas brancas sob um arco\">\n      <\u002Ffigure>\n      <div class=\"areas-conteudo\">\n        <div class=\"cabeca-secao\">\n          <p class=\"rotulo\">Áreas de atuação<\u002Fp>\n          <h2 class=\"titulo-secao\"><span class=\"linha\">Os temas em que<\u002Fspan> <span class=\"linha\">a clínica atua<\u002Fspan><\u002Fh2>\n          <p class=\"apoio\">Os detalhes de cada área são apresentados com calma na avaliação.<\u002Fp>\n        <\u002Fdiv>\n        <ol class=\"grade-areas\">\n          <li class=\"area\"><span class=\"numero\">01<\u002Fspan><h3>Educação<\u002Fh3><p>Cursos e formação para profissionais da área.<\u002Fp><a class=\"saiba-mais\" href=\"#contato\">Saiba mais <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa><\u002Fli>\n          <li class=\"area\"><span class=\"numero\">02<\u002Fspan><h3>Estética<\u002Fh3><p>Cuidados estéticos com avaliação individual.<\u002Fp><a class=\"saiba-mais\" href=\"#contato\">Saiba mais <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa><\u002Fli>\n          <li class=\"area\"><span class=\"numero\">03<\u002Fspan><h3>Carreira<\u002Fh3><p>Orientação para quem quer crescer profissionalmente.<\u002Fp><a class=\"saiba-mais\" href=\"#contato\">Saiba mais <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa><\u002Fli>\n          <li class=\"area\"><span class=\"numero\">04<\u002Fspan><h3>Negócios<\u002Fh3><p>Apoio para estruturar e fazer crescer o negócio.<\u002Fp><a class=\"saiba-mais\" href=\"#contato\">Saiba mais <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa><\u002Fli>\n          <li class=\"area\"><span class=\"numero\">05<\u002Fspan><h3>Expansão<\u002Fh3><p>Caminhos para ampliar a atuação.<\u002Fp><a class=\"saiba-mais\" href=\"#contato\">Saiba mais <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa><\u002Fli>\n          <li class=\"area\"><span class=\"numero\">06<\u002Fspan><h3>Investimentos<\u002Fh3><p>Orientação para decisões de investimento na área.<\u002Fp><a class=\"saiba-mais\" href=\"#contato\">Saiba mais <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa><\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"como-funciona\" class=\"fundo-preto\">\n    <div class=\"conteudo secao\">\n      <div class=\"cabeca-secao\">\n        <p class=\"rotulo\">Como funciona<\u002Fp>\n        <h2 class=\"titulo-secao\"><span class=\"linha\">Três etapas,<\u002Fspan> <span class=\"linha\">no seu tempo<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <ol class=\"passos\">\n        <li class=\"passo\" style=\"--i:0\"><span class=\"marcador\" aria-hidden=\"true\">01<\u002Fspan><h3>Avaliação<\u002Fh3><p class=\"passo-linha\">Conversa e análise do seu caso.<\u002Fp><p class=\"passo-texto\">Um primeiro encontro para entender o que você procura e conhecer o seu histórico. Nada é decidido nesse momento.<\u002Fp><ul class=\"passo-lista\"><li>Conversa sobre suas expectativas<\u002Fli><li>Análise individual do caso<\u002Fli><li>Esclarecimento de dúvidas<\u002Fli><\u002Ful><\u002Fli>\n        <li class=\"passo\" style=\"--i:1\"><span class=\"marcador\" aria-hidden=\"true\">02<\u002Fspan><h3>Plano personalizado<\u002Fh3><p class=\"passo-linha\">As indicações são definidas com você.<\u002Fp><p class=\"passo-texto\">A partir da avaliação, a equipe apresenta as opções possíveis e explica cada uma. Você decide o que faz sentido para você.<\u002Fp><ul class=\"passo-lista\"><li>Explicação das opções indicadas<\u002Fli><li>Etapas e prazos combinados<\u002Fli><li>Condições informadas com antecedência<\u002Fli><\u002Ful><\u002Fli>\n        <li class=\"passo\" style=\"--i:2\"><span class=\"marcador\" aria-hidden=\"true\">03<\u002Fspan><h3>Acompanhamento<\u002Fh3><p class=\"passo-linha\">Retornos para acompanhar a evolução.<\u002Fp><p class=\"passo-texto\">Depois de cada etapa, os retornos servem para observar como você está e ajustar o plano quando for preciso.<\u002Fp><ul class=\"passo-lista\"><li>Retornos agendados<\u002Fli><li>Orientações de cuidado em casa<\u002Fli><li>Canal aberto para dúvidas<\u002Fli><\u002Ful><\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"equipe\" class=\"fundo-bege\">\n    <div class=\"conteudo secao duas-colunas equipe\">\n      <figure class=\"foto foto-revela\">\n        <span class=\"revela-moldura\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgEASABIAAD/4gxYSUNDX1BST0ZJTEUAAQEAAAxITGlubwIQAABtbnRyUkdCIFhZWiAHzgACAAkABgAxAABhY3NwTVNGVAAAAABJRUMgc1JHQgAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLUhQICAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABFjcHJ0AAABUAAAADNkZXNjAAABhAAAAGx3dHB0AAAB8AAAABRia3B0AAACBAAAABRyWFlaAAACGAAAABRnWFlaAAACLAAAABRiWFlaAAACQAAAABRkbW5kAAACVAAAAHBkbWRkAAACxAAAAIh2dWVkAAADTAAAAIZ2aWV3AAAD1AAAACRsdW1pAAAD+AAAABRtZWFzAAAEDAAAACR0ZWNoAAAEMAAAAAxyVFJDAAAEPAAACAxnVFJDAAAEPAAACAxiVFJDAAAEPAAACAx0ZXh0AAAAAENvcHlyaWdodCAoYykgMTk5OCBIZXdsZXR0LVBhY2thcmQgQ29tcGFueQAAZGVzYwAAAAAAAAASc1JHQiBJRUM2MTk2Ni0yLjEAAAAAAAAAAAAAABJzUkdCIElFQzYxOTY2LTIuMQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWFlaIAAAAAAAAPNRAAEAAAABFsxYWVogAAAAAAAAAAAAAAAAAAAAAFhZWiAAAAAAAABvogAAOPUAAAOQWFlaIAAAAAAAAGKZAAC3hQAAGNpYWVogAAAAAAAAJKAAAA+EAAC2z2Rlc2MAAAAAAAAAFklFQyBodHRwOi8vd3d3LmllYy5jaAAAAAAAAAAAAAAAFklFQyBodHRwOi8vd3d3LmllYy5jaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABkZXNjAAAAAAAAAC5JRUMgNjE5NjYtMi4xIERlZmF1bHQgUkdCIGNvbG91ciBzcGFjZSAtIHNSR0IAAAAAAAAAAAAAAC5JRUMgNjE5NjYtMi4xIERlZmF1bHQgUkdCIGNvbG91ciBzcGFjZSAtIHNSR0IAAAAAAAAAAAAAAAAAAAAAAAAAAAAAZGVzYwAAAAAAAAAsUmVmZXJlbmNlIFZpZXdpbmcgQ29uZGl0aW9uIGluIElFQzYxOTY2LTIuMQAAAAAAAAAAAAAALFJlZmVyZW5jZSBWaWV3aW5nIENvbmRpdGlvbiBpbiBJRUM2MTk2Ni0yLjEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHZpZXcAAAAAABOk/gAUXy4AEM8UAAPtzAAEEwsAA1yeAAAAAVhZWiAAAAAAAEwJVgBQAAAAVx/nbWVhcwAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAo8AAAACc2lnIAAAAABDUlQgY3VydgAAAAAAAAQAAAAABQAKAA8AFAAZAB e consultório\"><\u002Fspan>\n        <figcaption>Foto ilustrativa<\u002Ffigcaption>\n      <\u002Ffigure>\n      <div class=\"coluna\">\n        <p class=\"rotulo\">Equipe<\u002Fp>\n        <h2 class=\"titulo-secao\"><span class=\"linha\">Atendimento individual,<\u002Fspan> <span class=\"linha\">com profissional habilitada<\u002Fspan><\u002Fh2>\n        <p class=\"apoio\">A avaliação e o plano de cuidado são conduzidos pela responsável técnica da clínica, que acompanha você em todas as etapas.<\u002Fp>\n        <p class=\"apoio\">O atendimento é feito com tempo, sem pressa para decidir. Cada indicação é explicada antes de começar, e você pode tirar dúvidas em qualquer etapa.<\u002Fp>\n        <ul class=\"compromissos\">\n          <li>Avaliação antes de qualquer indicação<\u002Fli>\n          <li>Explicação clara de cada etapa<\u002Fli>\n          <li>Sigilo sobre as informações do seu caso<\u002Fli>\n          <li>Decisões tomadas junto com você<\u002Fli>\n        <\u002Ful>\n        <blockquote class=\"citacao\"><p>“Gosto de começar ouvindo. Cada pessoa chega com uma história, e o cuidado precisa respeitar isso.”<\u002Fp><footer>Dra. Helena Duarte, responsável técnica<\u002Ffooter><\u002Fblockquote>\n        <p class=\"responsavel\"><strong>Responsável técnica:<\u002Fstrong> Dra. Helena Duarte · CRM-CE 00000 (fictício)<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"conteudo equipe-time\">\n      <p class=\"rotulo\">Equipe de apoio<\u002Fp>\n      <p class=\"membro-aviso\">Nomes fictícios. Fotos ilustrativas.<\u002Fp>\n      <ul class=\"time\">\n        <li class=\"membro\"><img class=\"membro-foto\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnV \n        <\u002Ffigure>\n      <\u002Fdiv>\n      <div class=\"lista-duvidas\">\n        <div class=\"duvida aberta\"><h3><button class=\"duvida-botao\" type=\"button\" aria-expanded=\"true\" aria-controls=\"resposta-1\" id=\"pergunta-1\"><span>A avaliação é paga?<\u002Fspan><span class=\"sinal\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"duvida-resposta\" id=\"resposta-1\" role=\"region\" aria-labelledby=\"pergunta-1\"><div><p class=\"apoio\">As condições são informadas antes de qualquer procedimento.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"duvida\"><h3><button class=\"duvida-botao\" type=\"button\" aria-expanded=\"false\" aria-controls=\"resposta-2\" id=\"pergunta-2\"><span>O procedimento dói?<\u002Fspan><span class=\"sinal\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"duvida-resposta\" id=\"resposta-2\" role=\"region\" aria-labelledby=\"pergunta-2\"><div><p class=\"apoio\">Cada caso é avaliado individualmente, e a equipe explica o que esperar antes de começar.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"duvida\"><h3><button class=\"duvida-botao\" type=\"button\" aria-expanded=\"false\" aria-controls=\"resposta-3\" id=\"pergunta-3\"><span>Quanto tempo dura o resultado?<\u002Fspan><span class=\"sinal\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"duvida-resposta\" id=\"resposta-3\" role=\"region\" aria-labelledby=\"pergunta-3\"><div><p class=\"apoio\">Depende de cada pessoa e do plano definido na avaliação.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"duvida\"><h3><button class=\"duvida-botao\" type=\"button\" aria-expanded=\"false\" aria-controls=\"resposta-4\" id=\"pergunta-4\"><span>Como funciona a primeira avaliação?<\u002Fspan><span class=\"sinal\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"duvida-resposta\" id=\"resposta-4\" role=\"region\" aria-labelledby=\"pergunta-4\"><div><p class=\"apoio\">É uma conversa individual para entender o que você procura, analisar o seu caso e explicar as opções possíveis. Nenhum procedimento é feito sem a sua concordância.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"duvida\"><h3><button class=\"duvida-botao\" type=\"button\" aria-expanded=\"false\" aria-controls=\"resposta-5\" id=\"pergunta-5\"><span>Quanto tempo dura a consulta?<\u002Fspan><span class=\"sinal\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"duvida-resposta\" id=\"resposta-5\" role=\"region\" aria-labelledby=\"pergunta-5\"><div><p class=\"apoio\">O tempo varia conforme o caso. A duração prevista é informada no momento do agendamento.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"duvida\"><h3><button class=\"duvida-botao\" type=\"button\" aria-expanded=\"false\" aria-controls=\"resposta-6\" id=\"pergunta-6\"><span>Preciso de algum preparo antes?<\u002Fspan><span class=\"sinal\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"duvida-resposta\" id=\"resposta-6\" role=\"region\" aria-labelledby=\"pergunta-6\"><div><p class=\"apoio\">Se houver algum cuidado prévio, a equipe orienta você com antecedência.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"duvida\"><h3><button class=\"duvida-botao\" type=\"button\" aria-expanded=\"false\" aria-controls=\"resposta-7\" id=\"pergunta-7\"><span>Quem faz o atendimento?<\u002Fspan><span class=\"sinal\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"duvida-resposta\" id=\"resposta-7\" role=\"region\" aria-labelledby=\"pergunta-7\"><div><p class=\"apoio\">A avaliação e o plano de cuidado são conduzidos pela responsável técnica da clínica.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"duvida\"><h3><button class=\"duvida-botao\" type=\"button\" aria-expanded=\"false\" aria-controls=\"resposta-8\" id=\"pergunta-8\"><span>Atendem nas duas cidades?<\u002Fspan><span class=\"sinal\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton><\u002Fh3><div class=\"duvida-resposta\" id=\"resposta-8\" role=\"region\" aria-labelledby=\"pergunta-8\"><div><p class=\"apoio\">Sim. O atendimento acontece nas unidades de Fortaleza e São Paulo.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contato\" class=\"fundo-bege\">\n    <div class=\"conteudo secao\">\n      <div class=\"cabeca-secao\">\n        <p class=\"rotulo\">Endereço e horário<\u002Fp>\n        <h2 class=\"titulo-secao\">Onde atendemos<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"unidades revela-contato\">\n        <div class=\"abas\" role=\"tablist\" aria-label=\"Unidades\"><button class=\"aba ativa\" type=\"button\" role=\"tab\" id=\"aba-fortaleza\" aria-controls=\"painel-fortaleza\" aria-selected=\"true\">Fortaleza<\u002Fbutton><button class=\"aba\" type=\"button\" role=\"tab\" id=\"aba-sao-paulo\" aria-controls=\"painel-sao-paulo\" aria-selected=\"false\" tabindex=\"-1\">São Paulo<\u002Fbutton><span class=\"abas-marca\" aria-hidden=\"true\"><\u002Fspan><\u002Fdiv>\n        <div class=\"paineis\">\n          <div class=\"painel ativo\" role=\"tabpanel\" id=\"painel-fortaleza\" aria-labelledby=\"aba-fortaleza\">\n            <div class=\"painel-bloco painel-endereco\"><p class=\"painel-rotulo\">Endereço<\u002Fp><p class=\"painel-rua\">Rua das Acácias, 120 · sala 4<\u002Fp><p class=\"painel-bairro\">Aldeota · Fortaleza, CE<\u002Fp><\u002Fdiv>\n            <div class=\"painel-bloco\"><p class=\"painel-rotulo\">Horário<\u002Fp><dl class=\"horarios\"><div><dt>Segunda a sexta<\u002Fdt><dd>9h às 19h<\u002Fdd><\u002Fdiv><div><dt>Sábado<\u002Fdt><dd>9h às 13h<\u002Fdd><\u002Fdiv><div><dt>Domingo<\u002Fdt><dd>Fechado<\u002Fdd><\u002Fdiv><\u002Fdl><\u002Fdiv>\n            <div class=\"painel-bloco\"><p class=\"painel-rotulo\">Como chegar<\u002Fp><ul class=\"como-chegar\"><li>Estacionamento conveniado no prédio, com entrada pela rua lateral.<\u002Fli><li>A 5 minutos a pé do ponto de ônibus da avenida principal.<\u002Fli><\u002Ful><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"painel\" role=\"tabpanel\" id=\"painel-sao-paulo\" aria-labelledby=\"aba-sao-paulo\" hidden=\"\">\n            <div class=\"painel-bloco painel-endereco\"><p class=\"painel-rotulo\">Endereço<\u002Fp><p class=\"painel-rua\">Alameda dos Ipês, 845 · 2º andar<\u002Fp><p class=\"painel-bairro\">Jardins · São Paulo, SP<\u002Fp><\u002Fdiv>\n            <div class=\"painel-bloco\"><p class=\"painel-rotulo\">Horário<\u002Fp><dl class=\"horarios\"><div><dt>Segunda a sexta<\u002Fdt><dd>8h às 20h<\u002Fdd><\u002Fdiv><div><dt>Sábado<\u002Fdt><dd>9h às 14h<\u002Fdd><\u002Fdiv><div><dt>Domingo<\u002Fdt><dd>Fechado<\u002Fdd><\u002Fdiv><\u002Fdl><\u002Fdiv>\n            <div class=\"painel-bloco\"><p class=\"painel-rotulo\">Como chegar<\u002Fp><ul class=\"como-chegar\"><li>Serviço de manobrista na entrada do edifício.<\u002Fli><li>A 8 minutos a pé da estação de metrô mais próxima.<\u002Fli><\u002Ful><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"unidades-aviso\">Endereços e horários fictícios.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"botoes contato-botoes\">\n        <a class=\"botao botao-principal\" href=\"#\">Agendar avaliação<\u002Fa>\n        <a class=\"botao botao-secundario\" href=\"#\">Falar no WhatsApp<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"faixa fundo-preto revela-faixa\" aria-label=\"Agendamento\">\n    <div class=\"conteudo secao\">\n      <div class=\"cabeca-secao\">\n        <p class=\"rotulo\">Agendamento<\u002Fp>\n        <h2 class=\"titulo-palavras\"><span class=\"linha\"><span class=\"p\" style=\"--n:0\"><span>Cada<\u002Fspan><\u002Fspan> <span class=\"p\" style=\"--n:1\"><span>atendimento<\u002Fspan><\u002Fspan> <span class=\"p\" style=\"--n:2\"><span>começa<\u002Fspan><\u002Fspan><\u002Fspan> <span class=\"linha\"><span class=\"p\" style=\"--n:3\"><span>com<\u002Fspan><\u002Fspan> <span class=\"p\" style=\"--n:4\"><span>uma<\u002Fspan><\u002Fspan> <span class=\"p\" style=\"--n:5\"><span>avaliação<\u002Fspan><\u002Fspan> <span class=\"p\" style=\"--n:6\"><span>individual.<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <a class=\"botao botao-principal\" href=\"#\">Agendar avaliação<\u002Fa>\n      <ol class=\"agenda-passos\">\n        <li><span class=\"agenda-num\">01<\u002Fspan><p class=\"agenda-titulo\">Escolha a unidade<\u002Fp><p class=\"agenda-texto\">Fortaleza ou São Paulo.<\u002Fp><\u002Fli>\n        <li><span class=\"agenda-num\">02<\u002Fspan><p class=\"agenda-titulo\">Agende<\u002Fp><p class=\"agenda-texto\">Pelo botão ou pelo WhatsApp, no horário que for melhor para você.<\u002Fp><\u002Fli>\n        <li><span class=\"agenda-num\">03<\u002Fspan><p class=\"agenda-titulo\">Avaliação<\u002Fp><p class=\"agenda-texto\">Uma conversa individual antes de qualquer indicação.<\u002Fp><\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer class=\"rodape fundo-preto\">\n  <div class=\"conteudo\">\n    <div class=\"rodape-colunas revela-rodape\">\n      <div class=\"rodape-marca\">\n        <a class=\"marca\" href=\"#inicio\">Clínica Estética<\u002Fa>\n        <p>Página de exemplo. Nomes, endereços e dados são fictícios.<\u002Fp>\n      <\u002Fdiv>\n      <nav class=\"rodape-coluna\" aria-label=\"Navegação do rodapé\">\n        <h2>Navegação<\u002Fh2>\n        <ul>\n          <li><a href=\"#areas\">Áreas de atuação<\u002Fa><\u002Fli>\n          <li><a href=\"#como-funciona\">Como funciona<\u002Fa><\u002Fli>\n          <li><a href=\"#equipe\">Equipe<\u002Fa><\u002Fli>\n          <li><a href=\"#duvidas\">Dúvidas<\u002Fa><\u002Fli>\n          <li><a href=\"#contato\">Contato<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fnav>\n      <div class=\"rodape-coluna\">\n        <h2>Contato<\u002Fh2>\n        <dl>\n          <div><dt>Fortaleza<\u002Fdt><d
